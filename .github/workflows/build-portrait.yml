name: Build transparent portrait
on:
  push:
    paths:
      - '.github/workflows/build-portrait.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Produce and verify portrait PNG
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          from pathlib import Path
          src=Path("public/andrea-portrait-final.jpg")
          assert src.is_file(), "Original JPEG missing"
          with Image.open(src) as check:
              check.verify()
          im=Image.open(src).convert("RGBA")
          w,h=im.size
          assert w>=500 and h>=900, f"Unexpected image dimensions {im.size}"
          points=[(0,1066),(0,775),(10,673),(26,553),(42,467),(68,415),(117,382),(174,353),(204,332),(206,293),(191,251),(188,207),(199,167),(220,126),(251,101),(283,91),(320,86),(354,94),(396,112),(426,143),(441,186),(434,226),(418,265),(391,319),(406,350),(460,370),(506,402),(542,449),(566,513),(584,650),(584,1066)]
          points=[(round(x*w/584),round(y*h/1066)) for x,y in points]
          mask=Image.new("L",(w,h),0)
          ImageDraw.Draw(mask).polygon(points,fill=255)
          mask=mask.filter(ImageFilter.GaussianBlur(1.5))
          im.putalpha(mask)
          target=Path("public/andrea-portrait-cutout.png")
          im.save(target,optimize=True)
          with Image.open(target) as result:
              result.verify()
          print("Verified cutout:",target, target.stat().st_size,"bytes")
          PY
      - name: Commit PNG
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/andrea-portrait-cutout.png
          if ! git diff --cached --quiet; then
            git commit -m "assets(home): verified transparent portrait"
            git push origin HEAD:main
          fi
