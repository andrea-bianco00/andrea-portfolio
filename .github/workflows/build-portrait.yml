name: Build professional portrait
on:
  push:
    paths:
      - '.github/workflows/build-portrait.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install AI background removal
        run: python -m pip install --disable-pip-version-check "rembg[cpu]" Pillow
      - name: Remove background with neural segmentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageFilter
          from rembg import remove,new_session
          source=Path('public/andrea-portrait-final.jpg')
          with Image.open(source) as img: img.verify()
          session=new_session('u2net')
          with Image.open(source) as img:
              result=remove(img.convert('RGBA'),session=session,alpha_matting=True,alpha_matting_foreground_threshold=240,alpha_matting_background_threshold=10,alpha_matting_erode_size=5)
          result.save('public/andrea-portrait-ai.png',optimize=True)
          with Image.open('public/andrea-portrait-ai.png') as verify:
              verify.verify()
          print('Verified portrait',Path('public/andrea-portrait-ai.png').stat().st_size)
          PY
      - name: Commit professional portrait
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/andrea-portrait-ai.png
          if ! git diff --cached --quiet; then
            git commit -m "assets(home): AI-segmented portrait with alpha matting"
            git push origin HEAD:main
          fi
