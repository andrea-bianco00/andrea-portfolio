name: Repair portrait image
on:
  push:
    paths:
      - '.github/workflows/repair-portrait.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image decoder
        run: python -m pip install Pillow
      - name: Decode and re-encode portrait safely
        shell: python
        run: |
          from PIL import Image, ImageFile
          from pathlib import Path
          ImageFile.LOAD_TRUNCATED_IMAGES = True
          path = Path('public/andrea-portrait.jpg')
          with Image.open(path) as image:
              print('Source:', image.format, image.size, image.mode)
              image.load()
              image.convert('RGB').save('public/andrea-portrait-repaired.jpg', 'JPEG', quality=92, optimize=True)
          with Image.open('public/andrea-portrait-repaired.jpg') as image:
              image.verify()
          print('JPEG repaired and verified')
      - name: Use verified JPEG in homepage
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          s = s.replace('/andrea-portrait.jpg?v=2','/andrea-portrait-repaired.jpg')
          p.write_text(s)
      - name: Commit verified image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/andrea-portrait-repaired.jpg app/page.tsx
          git diff --cached --quiet || (git commit -m "fix(home): repair and verify portrait JPEG" && git push)
