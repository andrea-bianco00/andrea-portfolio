name: Geometry Survivor AI smoke test
on:
  push:
    branches: [main]
    paths:
      - 'app/lib/geometry-core.ts'
      - 'app/lib/geometry-mpc.ts'
      - 'app/components/GeometrySurvivor.tsx'
      - 'scripts/check-geometry-mpc.cjs'
      - '.github/workflows/geometry-ai.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Deterministic real-game MPC smoke
        run: node scripts/check-geometry-mpc.cjs
      - name: TypeScript and production build
        run: npm run build
